name: Deploy to GitHub Pages

# 触发：推送 main 分支，或手动在 Actions 页面运行
on:
  push:
    branches: [main]
  workflow_dispatch:

# 最小必要权限：读取代码 + 部署 Pages + OIDC token
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，新推送取消旧运行
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # 生产构建会把 manifest 里的 localhost 替换为 GitHub Pages 地址
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
